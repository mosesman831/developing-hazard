apiVersion: apps/v1
kind: Deployment
metadata:
  name: developing-hazard
  namespace: NS_PLACEHOLDER
  labels:
    app: developing-hazard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: developing-hazard
  template:
    metadata:
      labels:
        app: developing-hazard
    spec:
      containers:
        - name: developing-hazard
          image: python:3.12-slim
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: DH_MODE
              value: demo
            - name: DH_DATA_DIR
              value: /code/data
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: developing-hazard-vss-creds
                  key: VSS_USERNAME
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: developing-hazard-vss-creds
                  key: VSS_PASSWORD
            - name: INGRESS_URL
              valueFrom:
                secretKeyRef:
                  name: developing-hazard-vss-creds
                  key: VSS_URL
          command:
            - bash
            - -lc
            - >-
              set -euo pipefail; mkdir -p /code; tar -xzf /cm/app.tar.gz -C /code;
              cd /code; pip install --no-cache-dir -q -r requirements-pod.txt;
              exec python -m uvicorn dh.server:app --host 0.0.0.0 --port "$PORT"
          volumeMounts:
            - name: code
              mountPath: /cm
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
      volumes:
        - name: code
          configMap:
            name: developing-hazard-code
---
apiVersion: v1
kind: Service
metadata:
  name: developing-hazard
  namespace: NS_PLACEHOLDER
  labels:
    app: developing-hazard
spec:
  type: ClusterIP
  selector:
    app: developing-hazard
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: developing-hazard
  namespace: NS_PLACEHOLDER
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: APP_HOST_PLACEHOLDER
      http:
        paths:
          - path: /app(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: developing-hazard
                port:
                  number: 80
