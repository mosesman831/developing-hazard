[project]
name = "developing-hazard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn", "pydantic>=2", "requests", "numpy", "opencv-python-headless",
  "pillow", "weave", "wandb", "openai", "typer", "python-dotenv", "pytest",
]

[project.optional-dependencies]
extra = ["supervision", "vastdb", "pyarrow"]

[tool.setuptools]
packages = ["dh", "dh.clients", "dh.agents", "dh.api"]
